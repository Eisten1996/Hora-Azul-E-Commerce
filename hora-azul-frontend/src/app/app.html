@if (isAdmin()) {
  <router-outlet />
} @else {
  <a
    href="#contenido"
    class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:text-hora-azul-800 focus:shadow"
  >
    Saltar al contenido
  </a>
  <app-navbar />
  <main id="contenido" class="mx-auto min-h-[calc(100vh-5rem)] max-w-7xl px-4 py-6 sm:px-6 lg:py-10">
    <router-outlet />
  </main>
  <app-footer />
  <app-cart-drawer />
}
