# =============================================================================
# Hora Azul Backend — Quarkus application.properties
# Perfiles: dev (H2 en memoria), test (H2 en memoria), prod (Neon PostgreSQL)
# =============================================================================

# La memoria de la JVM en producción (capa gratuita de 512 MB) se fija en el Dockerfile.

# -----------------------------------------------------------------------------
# HTTP — Render/Koyeb indican el puerto en la variable PORT
# -----------------------------------------------------------------------------
quarkus.http.port=${PORT:8080}
# Tests en un puerto libre aleatorio (Docker Desktop suele ocupar el 8081 por defecto)
quarkus.http.test-port=0
quarkus.http.enable-compression=true

# CORS — común a todos los perfiles
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# CORS para Cloudflare Pages (prod); varios orígenes separados por comas
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:https://hora-azul.pages.dev}

# CORS permisivo en dev/test: cualquier origen
%dev.quarkus.http.cors.origins=*
%test.quarkus.http.cors.origins=*

# -----------------------------------------------------------------------------
# Datasource — Perfil PROD: Neon PostgreSQL vía variable de entorno
# Las credenciales NO están hardcodeadas; se inyectan desde el entorno de Render/Koyeb
# -----------------------------------------------------------------------------
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# Pool de conexiones optimizado para Neon serverless
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.datasource.jdbc.max-size=5
%prod.quarkus.datasource.jdbc.acquisition-timeout=10S

# -----------------------------------------------------------------------------
# Esquema y datos — Flyway en todos los perfiles (db/migration/V*.sql)
# Hibernate no crea tablas: solo valida que coincidan con las entidades.
# -----------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# -----------------------------------------------------------------------------
# Datasource — Perfil DEV: H2 en memoria
# -----------------------------------------------------------------------------
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:horaazuldev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=

%dev.quarkus.hibernate-orm.log.sql=true

# -----------------------------------------------------------------------------
# Datasource — Perfil TEST: H2 en memoria (aislado por test)
# -----------------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:horaazultest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

# -----------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
%dev.quarkus.log.level=DEBUG

# -----------------------------------------------------------------------------
# OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

# -----------------------------------------------------------------------------
# Health checks: GET /q/health (incluye la conexión a la base de datos).
# Render lo usa como health check; la UI de health solo existe en modo dev.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Seguridad — HTTP Basic Auth con usuarios embebidos
# Activo en todos los perfiles; en test permite verificar los 401 de los
# endpoints de administración con RestAssured.
# -----------------------------------------------------------------------------
%dev.quarkus.http.auth.basic=true
%test.quarkus.http.auth.basic=true
%prod.quarkus.http.auth.basic=true

%dev.quarkus.security.users.embedded.enabled=true
%test.quarkus.security.users.embedded.enabled=true
%prod.quarkus.security.users.embedded.enabled=true

%dev.quarkus.security.users.embedded.plain-text=true
%test.quarkus.security.users.embedded.plain-text=true
%prod.quarkus.security.users.embedded.plain-text=true

# Credenciales de administrador para el MVP
# En prod la contraseña es obligatoria (variable ADMIN_PASSWORD): sin ella la app no arranca
%dev.quarkus.security.users.embedded.users.admin=admin123
%test.quarkus.security.users.embedded.users.admin=admin123
%prod.quarkus.security.users.embedded.users.admin=${ADMIN_PASSWORD}

%dev.quarkus.security.users.embedded.roles.admin=admin
%test.quarkus.security.users.embedded.roles.admin=admin
%prod.quarkus.security.users.embedded.roles.admin=admin
