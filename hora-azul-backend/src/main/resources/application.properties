# =============================================================================
# Hora Azul Backend — Quarkus application.properties
# Perfiles: dev (H2 en memoria), test (H2 en memoria), prod (Neon PostgreSQL)
# =============================================================================

# -----------------------------------------------------------------------------
# JVM heap límitado para despliegue en tier gratuito (Render/Koyeb)
# -----------------------------------------------------------------------------
quarkus.jvm.args=-Xmx512m -Xms128m

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.enable-compression=true

# CORS — común a todos los perfiles
quarkus.http.cors=true
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# CORS para Cloudflare Pages (prod)
%prod.quarkus.http.cors.origins=https://hora-azul.pages.dev

# CORS permisivo en dev/test: cualquier origen
%dev.quarkus.http.cors.origins=*
%test.quarkus.http.cors.origins=*

# -----------------------------------------------------------------------------
# Datasource — Perfil PROD: Neon PostgreSQL vía variable de entorno
# Las credenciales NO están hardcodeadas; se inyectan desde el entorno de Render/Koyeb
# -----------------------------------------------------------------------------
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# Pool de conexiones optimizado para Neon serverless
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.datasource.jdbc.max-size=5
%prod.quarkus.datasource.jdbc.acquisition-timeout=10S

# Hibernate: actualiza esquema sin recrear tablas
%prod.quarkus.hibernate-orm.database.generation=update

# -----------------------------------------------------------------------------
# Datasource — Perfil DEV: H2 en memoria
# -----------------------------------------------------------------------------
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:horaazuldev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=

%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true

# -----------------------------------------------------------------------------
# Datasource — Perfil TEST: H2 en memoria (aislado por test)
# -----------------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:horaazultest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

%test.quarkus.hibernate-orm.database.generation=drop-and-create

# -----------------------------------------------------------------------------
# Logs
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
%dev.quarkus.log.level=DEBUG

# -----------------------------------------------------------------------------
# OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

# -----------------------------------------------------------------------------
# Health checks
# -----------------------------------------------------------------------------
quarkus.smallrye-health.ui.enable=false
